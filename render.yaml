services:
  - type: web
    name: tcet-notes-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: DATABASE_URL
        value: file:./data/lms.db
      - key: PPTX_OUTPUT_PATH
        value: ./data/pptx
      - key: VECTOR_INDEX_PATH
        value: ./data/vector-index
      # Set these manually in Render dashboard (secret values):
      # GEMINI_API_KEY  →  your key
      # CLIENT_URL      →  your Vercel frontend URL
